<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Demo core | e-talent</title>
    <script>
        document.documentElement.setAttribute('data-theme', localStorage.getItem('corePlatformTheme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
    </script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="assets/css/app.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark app-navbar sticky-top">
    <div class="container-fluid px-lg-4">
        <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="#">
            <span class="brand-mark"><i class="bi bi-shield-check"></i></span>
            e-talent
        </a>
    </div>
</nav>

<main class="app-shell">
    <div class="container-fluid px-lg-4">
        <section class="page-header">
            <div>
                <p class="text-uppercase text-primary fw-bold small mb-1">Demo funcional</p>
                <h1 class="fw-bold mb-1">Administracion core</h1>
                <p class="text-muted mb-0">Vista estatica de referencia para empresas, usuarios, perfiles y configuracion.</p>
            </div>
        </section>

        <section class="dashboard-grid">
            <div class="metric-card">
                <span class="metric-icon"><i class="bi bi-buildings"></i></span>
                <span class="metric-value">2</span>
                <span class="metric-label">Empresas</span>
            </div>
            <div class="metric-card">
                <span class="metric-icon"><i class="bi bi-people"></i></span>
                <span class="metric-value">4</span>
                <span class="metric-label">Usuarios</span>
            </div>
            <div class="metric-card">
                <span class="metric-icon"><i class="bi bi-shield-lock"></i></span>
                <span class="metric-value">3</span>
                <span class="metric-label">Perfiles</span>
            </div>
            <div class="metric-card">
                <span class="metric-icon"><i class="bi bi-ui-checks-grid"></i></span>
                <span class="metric-value">3</span>
                <span class="metric-label">Campos dinamicos</span>
            </div>
        </section>
    </div>
</main>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
