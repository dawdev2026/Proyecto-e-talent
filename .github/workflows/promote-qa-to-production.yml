name: Promote QA to production

on:
  workflow_run:
    workflows: ["QA functional and accessibility validation"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  create-production-promotion:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Create and merge production promotion PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY}"
          pr_url="$(gh pr list --repo "$repo" --base produccion --head qa --state open --json url --jq '.[0].url')"
          if [ -z "$pr_url" ]; then
            gh pr create --repo "$repo" --base produccion --head qa \
              --title "Promote QA to production" \
              --body "Promoción automática después de validación QA exitosa."
          else
            echo "Open production promotion PR: $pr_url"
          fi
          pr_url="$(gh pr list --repo "$repo" --base produccion --head qa --state open --json url --jq '.[0].url')"
          # The QA workflow has already succeeded, so merge immediately.
          # `--auto` only queues the PR and requires branch auto-merge rules;
          # this repository does not enforce those rules on the private plan.
          gh pr merge "$pr_url" --repo "$repo" --squash
