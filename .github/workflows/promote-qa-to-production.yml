name: Promote QA to production

on:
  workflow_run:
    workflows: ["Promote development to QA"]
    types: [completed]

permissions:
  contents: read
  pull-requests: write

jobs:
  create-production-promotion:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Create production PR for manual confirmation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY}"
          pr_url="$(gh pr list --repo "$repo" --base produccion --head qa --state open --json url --jq '.[0].url')"
          if [ -z "$pr_url" ]; then
            gh pr create --repo "$repo" --base produccion --head qa \
              --title "Promote QA to production" \
              --body "Promotion preparada automáticamente. La revisión y fusión requieren confirmación manual."
          else
            echo "Open production promotion PR: $pr_url"
          fi
