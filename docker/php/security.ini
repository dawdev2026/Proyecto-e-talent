; Desarrollo debe reproducir la política de QA y Producción.
; Ningún código de la plataforma puede ejecutar comandos del sistema desde PHP.
disable_functions = exec,shell_exec

; Cargas administrativas: hasta 16 MB por archivo y 32 MB por solicitud.
; La aplicación limita cada imagen de marca a 10 MB.
upload_max_filesize = 16M
post_max_size = 32M
